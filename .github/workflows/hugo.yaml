name: Deploy Hinode site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

# 🚀 UPDATED PERMISSIONS FOR DIRECT DEPLOYMENT
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HUGO_CACHEDIR: /tmp/hugo_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 🚀 NEW STEP: Restores actual file modification times from Git commit history
      - name: Restore accurate Git timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # 🚀 NPM CACHE RESTORED

      - name: Cache Hugo Modules 
        uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache
          # 🚀 FIX 1: Updated key to bust the broken cache
          key: ${{ runner.os }}-hugomod-v3-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Cache Hugo Resources 
        uses: actions/cache@v4
        with:
          path: resources
          # 🚀 FIX 1: Updated key to bust the broken cache
          key: ${{ runner.os }}-hugo-resources-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-
          save-always: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Install npm dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          # Add local node_modules/.bin to PATH (provides fallback 'sass' CLI from package.json)
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Setup Dart Sass (1.101.0) with Retry & Fallback
        run: |
          # Retry up to 5 times if GitHub Releases throws a temporary 502/503/504 error
          if curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -o dart-sass.tar.gz \
            https://github.com/sass/dart-sass/releases/download/1.101.0/dart-sass-1.101.0-linux-x64.tar.gz; then
            tar -xvf dart-sass.tar.gz
            echo "$(pwd)/dart-sass" >> $GITHUB_PATH
            echo "✅ Installed standalone Dart Sass 1.101.0"
          else
            echo "⚠️ GitHub Releases returned 502/timeout. Falling back to npm Dart Sass in node_modules/.bin"
          fi

      # 🚀 FAST PATH: Try building directly without Python or pip overhead
      - name: Fast Build with Hugo
        id: hugo_build
        continue-on-error: true
        env:
          HUGO_ENVIRONMENT: production
          NODE_ENV: production
        run: hugo -F --gc --minify --logLevel error

      # 🩺 CONDITIONAL HEALER PATH: Only runs if the fast build failed due to a syntax/link error
      - name: Setup Python (Only on Error)
        if: steps.hugo_build.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies (Only on Error)
        if: steps.hugo_build.outcome == 'failure'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pre-Deployment Link Fixer (Only on Error)
        if: steps.hugo_build.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate_post.py --fix-links

      - name: Run AI Healer & Rebuild (Only on Error)
        if: steps.hugo_build.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_post.py --heal-hugo

        # 🚀 Write IndexNow verification file into ./public before deploying to GitHub Pages
      - name: Create IndexNow Verification File
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_API_KEY || secrets.BING_API_KEY }}
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then
            mkdir -p ./public
            echo -n "$INDEXNOW_KEY" > "./public/${INDEXNOW_KEY}.txt"
            echo "✅ Created IndexNow verification file in ./public/${INDEXNOW_KEY}.txt"
          fi

        # 🚀 THE FIX: Use standard Git push instead of GitHub's broken API
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ltdeveloperblogs/ltdeveloperblogs.github.io
          publish_branch: main
          publish_dir: ./public
          keep_files: false

      # --- BROADCAST STEPS ---
      - name: Smart Wait for GitHub Pages (Prevent 404s)
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          if [[ "$COMMIT_MSG" != *"Published article batch"* ]]; then
            echo "Not an automated article batch. Skipping wait."
            exit 0
          fi
          
          echo "⏳ Automated posts detected! Waiting 75 seconds for GitHub Pages deployment to propagate..."
          sleep 75

      - name: Broadcast to Social Media
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCP_INDEXING_JSON: ${{ secrets.GCP_INDEXING_JSON }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TUMBLR_KEY: ${{ secrets.TUMBLR_KEY }}
          TUMBLR_SECRET: ${{ secrets.TUMBLR_SECRET }}
          TUMBLR_OAUTH: ${{ secrets.TUMBLR_OAUTH }}
          TUMBLR_OAUTH_SECRET: ${{ secrets.TUMBLR_OAUTH_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WP_COM_CLIENT_ID: ${{ secrets.WP_COM_CLIENT_ID }}
          WP_COM_CLIENT_SECRET: ${{ secrets.WP_COM_CLIENT_SECRET }}
          WP_COM_USERNAME: ${{ secrets.WP_COM_USERNAME }}
          WP_COM_PASSWORD: ${{ secrets.WP_COM_PASSWORD }}
          WP_COM_SITE_DOMAIN: ${{ secrets.WP_COM_SITE_DOMAIN }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Last commit message was: $COMMIT_MSG"
          
          if [[ "$COMMIT_MSG" == *"Published article batch"* ]]; then
            echo "📣 Automated post detected via commit message! Launching dynamic broadcast..."
            # Use the emergency broadcaster to scan for recent .md files instead of the json queue
            python generate_post.py --force-recent
          else
            echo "✅ Standard code push. Skipping broadcast to prevent duplicates."
          fi